<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your AIOS email</title>
  </head>
  <body style="margin:0;background:#f6f5fb;color:#292440;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:32px auto;background:#ffffff;border:1px solid #e7e2ef;border-radius:16px;padding:40px">
      <p style="margin:0 0 20px;color:#7659e7;font-size:12px;font-weight:700;letter-spacing:.12em">AIOS ACCOUNT VERIFICATION</p>
      <h1 style="margin:0 0 14px;font-family:Georgia,serif;font-size:30px;line-height:1.15">Verify your work email.</h1>
      <p style="margin:0;color:#6f6978;line-height:1.65">Enter this single-use code in the AIOS signup tab:</p>
      <p style="margin:28px 0;border-radius:12px;background:#f3f0ff;padding:18px;text-align:center;color:#33274f;font-size:34px;font-weight:800;letter-spacing:.22em">{{ .Token }}</p>
      <p style="margin:0;color:#6f6978;font-size:13px;line-height:1.65">The code expires in 10 minutes. AIOS will never ask you to send or read this code to another person. If you did not create an account, ignore this email.</p>
    </main>
  </body>
</html>
